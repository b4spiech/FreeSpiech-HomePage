<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeSpiech — Workflow Systems</title>
  <meta name="description" content="FreeSpiech Workflow Systems — a hub of apps that help you think, plan, and communicate.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --blue-deep: #1a6fd4;
      --blue-bright: #2a84f0;
      --blue-soft: #5a9ae0;
      --ink: #1a2030;
      --muted: #6b7a90;
      --border: #e4ebf5;
      --border-hover: #2a84f0;
      --bg: #ffffff;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header.brand {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0 48px;
    }

    header.brand svg {
      width: 100%;
      max-width: 400px;
      height: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--border-hover);
      box-shadow: 0 8px 24px rgba(42, 132, 240, 0.10);
      transform: translateY(-2px);
      outline: none;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--blue-deep);
      letter-spacing: -0.01em;
    }

    .card-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--blue-soft);
      letter-spacing: 0.02em;
    }

    .card:hover .card-link {
      color: var(--blue-bright);
    }

    footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 16px 48px;
      }
      header.brand {
        padding: 8px 0 32px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand">
      <svg width="400" height="240" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
        <title>FreeSpiech logo</title>
        <circle cx="170" cy="200" r="105" fill="none" stroke="#1a6fd4" stroke-width="3" opacity="0.18"/>
        <circle cx="170" cy="200" r="85" fill="none" stroke="#1a6fd4" stroke-width="1.5" opacity="0.12"/>
        <circle cx="170" cy="112" r="16" fill="#1a6fd4"/>
        <circle cx="249" cy="163" r="16" fill="#2a84f0"/>
        <circle cx="220" cy="258" r="16" fill="#1a6fd4"/>
        <circle cx="120" cy="258" r="16" fill="#2a84f0"/>
        <circle cx="91" cy="163" r="16" fill="#1a6fd4"/>
        <line x1="182" y1="124" x2="238" y2="151" stroke="#1a6fd4" stroke-width="2" opacity="0.5"/>
        <line x1="249" y1="180" x2="230" y2="243" stroke="#1a6fd4" stroke-width="2" opacity="0.5"/>
        <line x1="207" y1="265" x2="133" y2="265" stroke="#1a6fd4" stroke-width="2" opacity="0.5"/>
        <line x1="110" y1="250" x2="98" y2="179" stroke="#1a6fd4" stroke-width="2" opacity="0.5"/>
        <line x1="104" y1="151" x2="158" y2="122" stroke="#1a6fd4" stroke-width="2" opacity="0.5"/>
        <line x1="170" y1="128" x2="216" y2="246" stroke="#1a6fd4" stroke-width="1" opacity="0.2"/>
        <line x1="170" y1="128" x2="124" y2="246" stroke="#1a6fd4" stroke-width="1" opacity="0.2"/>
        <line x1="235" y1="170" x2="107" y2="170" stroke="#1a6fd4" stroke-width="1" opacity="0.2"/>
        <circle cx="170" cy="200" r="22" fill="#1a6fd4" opacity="0.12"/>
        <circle cx="170" cy="200" r="10" fill="#1a6fd4"/>
        <circle cx="170" cy="112" r="5" fill="white" opacity="0.8"/>
        <circle cx="249" cy="163" r="5" fill="white" opacity="0.8"/>
        <circle cx="220" cy="258" r="5" fill="white" opacity="0.8"/>
        <circle cx="120" cy="258" r="5" fill="white" opacity="0.8"/>
        <circle cx="91" cy="163" r="5" fill="white" opacity="0.8"/>
        <text x="305" y="186" font-family="Arial, sans-serif" font-weight="500" font-size="42px" fill="#1a6fd4">freespiech</text>
        <text x="308" y="218" font-family="Arial, sans-serif" font-weight="400" font-size="15px" fill="#5a9ae0" letter-spacing="2.5">WORKFLOW SYSTEMS</text>
        <text x="308" y="248" font-family="monospace" font-weight="400" font-size="13px" fill="#5a9ae0">freespiech.com</text>
        <line x1="290" y1="140" x2="290" y2="270" stroke="#1a6fd4" stroke-width="1.5" opacity="0.2"/>
      </svg>
    </header>

    <main>
      <div class="grid">
        <a class="card" href="https://present.freespiech.com">
          <h2 class="card-title">Compelling Communicator</h2>
          <p class="card-description">A 7-step persuasive presentation planning wizard.</p>
          <span class="card-link">present.freespiech.com &rarr;</span>
        </a>
      </div>
    </main>

    <footer>
      &copy; FreeSpiech &middot; Workflow Systems
    </footer>
  </div>
</body>
</html>
